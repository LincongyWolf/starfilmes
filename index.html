<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starfilmes</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <span class="logo"><svg viewBox="0 0 40 40" width="34" height="34"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd86b"/><stop offset="1" stop-color="#ff8a1f"/></linearGradient></defs><path d="M20 3l4.9 10.9 11.9 1.2-8.9 8 2.6 11.7L20 28.6 9.5 34.8l2.6-11.7-8.9-8 11.9-1.2z" fill="url(#g)"/><path d="M17.5 14.5l8 5.5-8 5.5z" fill="#040714"/></svg><span><b>Star</b>filmes</span></span>
  <span class="hr"><input id="q" type="search" placeholder="Buscar títulos"><button class="btn ghost" id="auth-btn">ENTRAR</button></span>
</header>
<div class="hero"><h1>Clássicos livres, de graça, no seu ritmo</h1><p>Filmes e séries em domínio público e conteúdo licenciado.</p></div>
<main id="rows"></main>
<section id="admin" hidden>
  <h2>Painel do administrador</h2>
  <form id="f-add">
    <input name="title" placeholder="Título" required>
    <input name="year" type="number" placeholder="Ano">
    <select name="genre"><option value="acao">Ação</option><option value="comedia">Comédia</option><option value="ficcao">Ficção científica</option><option value="serie">Série</option></select>
    <input name="license" placeholder="Licença (ex.: domínio público)">
    <input name="poster" placeholder="URL da capa (https://...)">
    <input name="video" placeholder="URL do vídeo .mp4 / .m3u8">
    <button class="btn">ADICIONAR</button>
  </form>
</section>
<dialog id="dlg-auth"><h3>Entrar na Starfilmes</h3>
  <input id="em" type="email" placeholder="E-mail" autocomplete="email">
  <input id="pw" type="password" placeholder="Senha" autocomplete="current-password">
  <div class="acts"><button class="btn" id="b-in">ENTRAR</button><button class="btn ghost" id="b-up">CRIAR CONTA</button></div>
  <p id="amsg" class="msg"></p><button class="x" onclick="this.closest('dialog').close()">×</button></dialog>
<dialog id="dlg-play"><h3 id="play-title"></h3><video id="vid" controls playsinline></video><button class="x" onclick="this.closest('dialog').close()">×</button></dialog>
<footer>© Starfilmes. Catálogo de exemplo com obras em domínio público; confirme a licença de cada título.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
